<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in | Automated Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/attribution/style.css" />
<link rel="icon" type="image/png" sizes="32x32" href="/attribution/assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="64x64" href="/attribution/assets/favicon-64.png" />
</head>
<body>

<header class="as-header">
  <a class="as-logo" href="/attribution"><img class="as-logo-mark" src="/attribution/assets/logo-mark.png" alt="Automated Sales logo" /> Automated Sales</a>
  <div class="as-nav-actions">
    <a class="as-btn as-btn-primary" href="/attribution/signup">Connect your Pipedrive</a>
  </div>
</header>

<div class="as-auth-wrap">
  <div class="as-auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to see your attribution dashboard.</p>

    <div class="as-alert" id="error"></div>

    <form id="login-form">
      <div class="as-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@acme.com" required />
      </div>
      <div class="as-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required />
      </div>
      <button type="submit" class="as-btn as-btn-green as-btn-block" id="submit-btn">Log in</button>
    </form>

    <div class="as-switch">Haven't connected yet? <a href="/attribution/signup">Connect your Pipedrive</a></div>
  </div>
</div>

<script>
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    try {
      const res = await fetch('/attribution/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorBox.textContent = data.error || 'Something went wrong — please try again.';
        errorBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
        return;
      }
      window.location.href = '/attribution/dashboard';
    } catch (err) {
      errorBox.textContent = 'Could not reach the server — please try again.';
      errorBox.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>

</body>
</html>
